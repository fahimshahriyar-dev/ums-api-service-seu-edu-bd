<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valid Admit Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-wrapper">
      <div class="card">
        <!-- Teal Header -->
        <div class="card-header">
          <div class="checkmark-circle">
            <svg viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>

        <!-- Title -->
        <div class="card-title">UMS - Admit Card Verification</div>

        <!-- Info Table -->
        <table class="info-table">
          <tr class="row-student-code">
            <td>Student Code</td>
            <td>2026100000182</td>
          </tr>
          <tr>
            <td>Student Name</td>
            <td>FAHIM SHAHRIYAR MUGDHO</td>
          </tr>
          <tr>
            <td>Semester</td>
            <td>Summer 2026</td>
          </tr>
          <tr>
            <td>Exam</td>
            <td>Final Examination</td>
          </tr>
          <tr>
            <td>Verification Code</td>
            <td>0575</td>
          </tr>
          <tr>
            <td>Student Photo</td>
            <td>
              <img src="img.png" alt="" class="student-photo" />
            </td>
          </tr>
        </table>

        <!-- Footer Button -->
        <div class="card-footer">
          <a href="https://ums.seu.edu.bd/dashboard" class="btn-back"
            >Back to UMS</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
