<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMS - Admit Card Verification</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-wrapper">
      <div class="card">
        <!-- Teal Header -->
        <div class="card-header">
          <div class="checkmark-circle">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z"/></svg>
          </div>
        </div>

        <!-- Title -->
        <div class="card-title">Valid Admit Card</div>

        <!-- Info Table -->
        <div class="table-wrapper">
          <table class="info-table">
            <tr class="row-student-code">
              <td>Student Code</td>
              <td id="val-student-code">2026100000182</td>
            </tr>
            <tr>
              <td>Student Name</td>
              <td id="val-student-name">FAHIM SHAHRIYAR MUGDHO</td>
            </tr>
            <tr>
              <td>Semester</td>
              <td id="val-semester">Summer 2026</td>
            </tr>
            <tr>
              <td>Exam</td>
              <td id="val-exam">Final Examination</td>
            </tr>
            <tr>
              <td>Verification Code</td>
              <td id="val-verification-code">0575</td>
            </tr>
            <tr>
              <td>Student Photo</td>
              <td>
                <img src="img.png" alt="" class="student-photo" id="val-student-photo" />
              </td>
            </tr>
          </table>
        </div>

        <!-- Footer Button -->
        <div class="card-footer">
          <a href="https://ums.seu.edu.bd/dashboard" class="btn-back"
            >Back to UMS</a
          >
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);

      const id = params.get('id');
      const name = params.get('name');
      const semester = params.get('semester');
      const exam = params.get('exam');
      const code = params.get('code');

      if (id) document.getElementById('val-student-code').textContent = id;
      if (name) document.getElementById('val-student-name').textContent = name;
      if (semester) document.getElementById('val-semester').textContent = semester;
      if (exam) {
        document.getElementById('val-exam').textContent = exam.includes('Exam') ? exam : `${exam} Examination`;
      }
      if (code) document.getElementById('val-verification-code').textContent = code;
    </script>
  </body>
</html>
